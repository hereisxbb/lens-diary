<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071613">
<title>旅迹 TripPins</title>
<link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#17201d;--g:#208567;--ink:#17201d;--muted:#7b8380;--paper:#fffefa}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#071613}button,input,textarea,select{font:inherit}.screen{position:absolute;inset:0;display:none;background:#f7f7f3;padding-bottom:74px}.screen.active{display:block}#mapScreen{padding:0;background:#071613}#map{position:absolute;inset:0 0 70px}.top{position:absolute;left:14px;right:14px;top:calc(12px + env(safe-area-inset-top));z-index:4;display:flex;justify-content:space-between;pointer-events:none}.brand,.round{pointer-events:auto;background:rgba(255,255,252,.93);backdrop-filter:blur(18px);box-shadow:0 8px 25px rgba(0,0,0,.13)}.brand{border-radius:18px;padding:8px 12px;display:flex;align-items:center;gap:8px}.mark{width:34px;height:34px;border-radius:12px 12px 12px 4px;background:linear-gradient(145deg,#45b996,#19795d);color:#fff;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{display:block;color:#808883;font-size:9px}.round{border:0;width:44px;height:44px;border-radius:50%;font-size:18px}.fab{position:absolute;right:15px;bottom:calc(205px + env(safe-area-inset-bottom));z-index:5;border:0;border-radius:999px;background:#19231f;color:#fff;padding:11px 15px;font-weight:800;font-size:12px;box-shadow:0 12px 32px rgba(0,0,0,.25)}.peek{position:absolute;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:4;background:rgba(255,255,252,.96);backdrop-filter:blur(20px);border-radius:24px 24px 16px 16px;padding:10px 13px 13px;box-shadow:0 20px 55px rgba(0,0,0,.15);max-height:135px}.peekhead{display:flex;justify-content:space-between;align-items:center}.peekhead b{font-size:15px}.peekhead small{font-size:10px;color:var(--muted)}#nearby{display:flex;gap:8px;overflow:auto;margin-top:8px}.mini{min-width:145px;border:0;background:#f1f2ed;border-radius:13px;padding:9px;text-align:left}.mini b{display:block;font-size:11px}.mini small{font-size:9px;color:var(--muted)}.nav{position:fixed;left:0;right:0;bottom:0;height:calc(67px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:20;background:rgba(255,255,253,.97);display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #eee}.nav button{border:0;background:none;color:#949a97;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;gap:3px}.nav span{font-size:20px}.nav button.active{color:#17201d}.head{padding:calc(24px + env(safe-area-inset-top)) 18px 14px;background:#fffefa}.head h1{font-size:29px;margin:0}.head p{font-size:11px;color:var(--muted);margin:3px 0}.search{padding:0 14px 10px;background:#fffefa}.search input{width:100%;border:0;background:#eff0eb;border-radius:13px;padding:11px 12px;outline:none}.list{height:calc(100% - 130px - env(safe-area-inset-top));overflow:auto;padding:10px 12px}.card{background:#fff;border:1px solid #e9e8e2;border-radius:17px;padding:13px;margin:8px 0}.cardtop{display:flex;justify-content:space-between}.card b{font-size:14px}.meta{font-size:9px;color:var(--muted);margin-top:3px}.source{border-top:1px solid #eee;margin-top:9px;padding-top:9px;font-size:10px}.source button{border:0;background:#fff0ee;color:#c54841;border-radius:8px;padding:7px 9px;font-weight:750}.settings{margin:12px 14px;background:#fff;border:1px solid #e8e7e1;border-radius:17px;padding:15px}.settings h3{font-size:14px;margin:0 0 7px}.settings p{font-size:11px;color:#68716d;line-height:1.6;margin:0}.sheetbg,.detailbg{position:fixed;inset:0;z-index:50;background:rgba(6,15,12,.38);display:none;align-items:flex-end;backdrop-filter:blur(4px)}.sheetbg.open,.detailbg.open{display:flex}.sheet,.detail{width:100%;max-height:88vh;overflow:auto;background:#fffefa;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -25px 60px rgba(0,0,0,.2)}.grab{width:36px;height:4px;border-radius:5px;background:#d4d5cf;margin:0 auto 10px}.sheettitle{display:flex;justify-content:space-between;align-items:start}.sheettitle h2{margin:0;font-size:24px}.sheettitle p{margin:2px 0 12px;color:var(--muted);font-size:10px}.close{border:0;background:#eff0eb;width:32px;height:32px;border-radius:50%;font-size:17px}.step{display:none}.step.on{display:block}label{display:block;font-size:11px;font-weight:800;margin:11px 0 6px}textarea,input,select{border:1px solid #e1e1dc;background:#faf9f6;border-radius:12px;padding:11px 12px;outline:none}textarea{width:100%;resize:none;line-height:1.5}.primary{width:100%;border:0;border-radius:13px;background:#19231f;color:#fff;padding:13px;font-weight:800;margin-top:13px}.ghost{width:100%;border:0;background:none;color:#747b78;padding:12px}.psearch{display:grid;grid-template-columns:1fr auto;gap:7px}.psearch input{width:100%}.psearch button{border:0;background:#19231f;color:#fff;border-radius:11px;padding:0 13px}.hint{font-size:9px;color:#858c88;line-height:1.5;margin:7px 2px}.result{border:1px solid #e7e6e0;background:#fff;border-radius:14px;padding:10px;margin:7px 0;display:flex;gap:9px;align-items:start}.result>div{flex:1;min-width:0}.result b{font-size:12px}.result small{display:block;font-size:9px;color:var(--muted);margin-top:3px;line-height:1.4}.result button{border:0;background:var(--g);color:#fff;border-radius:8px;padding:7px 8px;font-size:9px;font-weight:800}.selected{background:#eef8f4;border:1px solid #d4eee4;border-radius:14px;padding:11px}.selected b{display:block}.selected small{font-size:9px;color:#60756e}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cols input,.cols select,#note{width:100%}.tripmarker{width:31px;height:36px;border:3px solid #fff;border-radius:15px 15px 15px 5px;background:#23876a;box-shadow:0 7px 18px rgba(0,0,0,.25);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:850}.toast{position:fixed;left:50%;bottom:90px;z-index:90;transform:translate(-50%,15px);opacity:0;background:rgba(20,28,24,.95);color:#fff;border-radius:999px;padding:9px 13px;font-size:10px;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
<section id="mapScreen" class="screen active"><div id="map"></div><header class="top"><div class="brand"><span class="mark">⌖</span><div><b>旅迹</b><small>TripPins</small></div></div><button class="round" id="locate">◎</button></header><button class="fab" id="add">＋ 从小红书收</button><section class="peek"><div class="peekhead"><div><b>我的旅行地图</b><small id="count">0 个地点</small></div><button class="ghost" id="fit" style="width:auto;padding:5px;color:#208567">查看全部</button></div><div id="nearby"></div></section></section>
<section id="savedScreen" class="screen"><div class="head"><h1>收藏</h1><p>按地点重新组织你存过的攻略</p></div><div class="search"><input id="q" placeholder="搜索地点、城市、攻略…"></div><div id="list" class="list"></div></section>
<section id="meScreen" class="screen"><div class="head"><h1>旅迹</h1><p>Mobile MVP</p></div><div class="settings"><h3>当前主链路</h3><p>小红书分享 → 旅迹 → 搜真实 POI → 一次确认 → 保存坐标和原帖 → 地图查看。</p></div><div class="settings"><h3>下一步</h3><p>接 iOS Share Extension，让「存到旅迹」真正出现在 iPhone 的系统分享菜单里。</p></div></section>
<nav class="nav"><button class="active" data-tab="mapScreen"><span>◉</span>地图</button><button data-tab="savedScreen"><span>☆</span>收藏</button><button data-tab="meScreen"><span>···</span>我的</button></nav>
</div>
<div class="sheetbg" id="sheet"><div class="sheet"><div class="grab"></div><div class="sheettitle"><div><h2>存到旅迹</h2><p>把一篇攻略变成地图上的真实地点</p></div><button class="close" id="close">×</button></div><div class="step on" id="s1"><label>小红书分享口令 / 链接</label><textarea rows="5" id="share" placeholder="把小红书「复制链接」得到的整段文字粘贴到这里"></textarea><button class="primary" id="next">下一步：找地点</button></div><div class="step" id="s2"><div id="src" class="hint"></div><label>这篇攻略主要存到哪里？</label><div class="psearch"><input id="poi" placeholder="例如：清水寺 京都"><button id="searchPoi">搜索</button></div><div class="hint">不从评论 IP 猜地点。这里仅展示地图数据库里的真实 POI。</div><div id="results"></div><button class="ghost" id="back1">← 返回</button></div><div class="step" id="s3"><div id="selected" class="selected"></div><div class="cols"><div><label>收藏到</label><input id="collection" placeholder="京都 / 北海道"></div><div><label>分类</label><select id="cat"><option>景点</option><option>圣地巡礼</option><option>美食</option><option>咖啡</option><option>探店</option><option>伴手礼</option><option>购物</option><option>住宿</option><option>其他</option></select></div></div><label>备注（可选）</label><input id="note" placeholder="比如：凌晨五点去、人少、要预约…"><button class="primary" id="save">保存到我的地图</button><button class="ghost" id="back2">← 换一个地点</button></div></div></div>
<div class="detailbg" id="detail"><div class="detail"><div class="grab"></div><button class="close" id="detailClose" style="float:right">×</button><div id="detailBody"></div></div></div>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(()=>{const K='trippins_mobile_v1',S={pins:[],map:null,markers:[],share:null,poi:null},$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,'');function toast(m){let t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}function load(){try{S.pins=JSON.parse(localStorage.getItem(K)||'[]')}catch(_){S.pins=[]}}function persist(){localStorage.setItem(K,JSON.stringify(S.pins))}function key(p){return p.placeKey||`${norm(p.collection)}|${norm(p.poiName)}|${(+p.lat).toFixed(5)}|${(+p.lon).toFixed(5)}`}function groups(pins=S.pins){let m=new Map;for(const p of pins){let k=key(p);if(!m.has(k))m.set(k,{key:k,poiName:p.poiName,collection:p.collection,category:p.category,lat:+p.lat,lon:+p.lon,pins:[]});m.get(k).pins.push(p)}return[...m.values()]}function initMap(){S.map=new maplibregl.Map({container:'map',style:'https://demotiles.maplibre.org/globe.json',center:[120,28],zoom:1.25});S.map.on('style.load',()=>{try{S.map.setProjection({type:'globe'})}catch(_){}});S.map.on('load',()=>{render();fit(false)})}function render(){S.markers.forEach(x=>x.remove());S.markers=[];for(const g of groups()){let e=document.createElement('div');e.className='tripmarker';e.textContent=g.pins.length>1?g.pins.length:'';e.onclick=()=>openDetail(g.key);S.markers.push(new maplibregl.Marker({element:e,anchor:'bottom'}).setLngLat([g.lon,g.lat]).addTo(S.map))}let gs=groups();$('count').textContent=`${gs.length} 个地点 · ${S.pins.length} 篇攻略`;$('nearby').innerHTML=gs.length?gs.slice(0,7).map(g=>`<button class="mini" data-k="${esc(g.key)}"><b>${esc(g.poiName)}</b><small>${esc(g.collection)} · ${g.pins.length} 篇</small></button>`).join(''):'<div class="hint">还没有收藏，点「从小红书收」开始。</div>';$('nearby').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>openDetail(b.dataset.k));renderList()}function renderList(){let q=$('q')?.value?.trim().toLowerCase()||'',gs=groups(S.pins.filter(p=>!q||[p.poiName,p.collection,p.sourceTitle,p.category].join(' ').toLowerCase().includes(q)));$('list').innerHTML=gs.length?gs.map(g=>`<article class="card"><div class="cardtop"><div><b>${esc(g.poiName)}</b><div class="meta">${esc(g.collection)} · ${esc(g.category)}</div></div><span class="meta">${g.pins.length} 篇</span></div>${g.pins.map(p=>`<div class="source"><b>${esc(p.sourceTitle)}</b><br>${p.sourceUrl?`<button data-u="${esc(p.sourceUrl)}">打开小红书原帖 ↗</button>`:''}</div>`).join('')}</article>`).join(''):'<div class="hint">还没有收藏。</div>';$('list').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>window.open(b.dataset.u,'_blank'))}function fit(anim=true){let gs=groups();if(!gs.length){S.map?.flyTo({center:[120,28],zoom:1.25,duration:anim?700:0});return}if(gs.length===1){S.map.flyTo({center:[gs[0].lon,gs[0].lat],zoom:12,duration:anim?700:0});return}let minx=180,maxx=-180,miny=90,maxy=-90;gs.forEach(g=>{minx=Math.min(minx,g.lon);maxx=Math.max(maxx,g.lon);miny=Math.min(miny,g.lat);maxy=Math.max(maxy,g.lat)});S.map.fitBounds([[minx,miny],[maxx,maxy]],{padding:{top:100,bottom:220,left:40,right:40},maxZoom:10,duration:anim?700:0})}function openDetail(k){let g=groups().find(x=>x.key===k);if(!g)return;$('detailBody').innerHTML=`<h2>${esc(g.poiName)}</h2><div class="meta">${esc(g.collection)} · ${esc(g.category)} · ${g.pins.length} 篇攻略</div>${g.pins.map(p=>`<div class="source"><b>${esc(p.sourceTitle)}</b>${p.note?`<p>${esc(p.note)}</p>`:''}${p.sourceUrl?`<button data-u="${esc(p.sourceUrl)}">打开小红书原帖 ↗</button>`:''}</div>`).join('')}`;$('detail').classList.add('open');$('detailBody').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>window.open(b.dataset.u,'_blank'))}function extract(raw){raw=String(raw||'').trim();let m=raw.match(/https?:\/\/(?:xhslink\.cn|www\.xiaohongshu\.com)\/[^\s\]\)]+/i)||raw.match(/https?:\/\/[^\s\]\)]+/i),url=m?.[0]?.replace(/[，。；;~～]+$/,'')||'',title=url?raw.slice(0,raw.indexOf(url)):raw;title=title.replace(/存下口令[\s\S]*$/,'').replace(/\s+/g,' ').trim();return{raw,url,title:(title||'小红书旅行攻略').slice(0,80)}}function step(n){[1,2,3].forEach(i=>$('s'+i).classList.toggle('on',i===n))}function openSheet(){$('sheet').classList.add('open');step(1)}async function searchPoi(){let q=$('poi').value.trim();if(!q)return;$('results').innerHTML='<div class="hint">正在搜索真实地点…</div>';try{let u='https://nominatim.openstreetmap.org/search?'+new URLSearchParams({q,format:'jsonv2',addressdetails:'1',limit:'5','accept-language':'zh-CN'}),r=await fetch(u),rows=await r.json();$('results').innerHTML=rows.length?rows.map((x,i)=>`<div class="result"><div><b>${esc(x.name||x.display_name.split(',')[0])}</b><small>${esc(x.display_name)}</small></div><button data-i="${i}">选这个</button></div>`).join(''):'<div class="hint">没找到，试试「地点名 + 城市/国家」。</div>';$('results').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>choose(rows[+b.dataset.i]))}catch(e){$('results').innerHTML='<div class="hint">搜索失败，请稍后重试。</div>'}}function choose(r){S.poi=r;$('selected').innerHTML=`<b>📍 ${esc(r.name||r.display_name.split(',')[0])}</b><small>${esc(r.display_name)}<br>${(+r.lat).toFixed(6)}, ${(+r.lon).toFixed(6)}</small>`;let a=r.address||{};$('collection').value=a.city||a.town||a.municipality||a.state||'旅行';step(3)}function save(){if(!S.poi||!S.share)return;let r=S.poi,p={id:'p_'+Date.now(),poiName:r.name||r.display_name.split(',')[0],collection:$('collection').value.trim()||'旅行',category:$('cat').value,lat:+r.lat,lon:+r.lon,placeKey:r.osm_type&&r.osm_id?`osm:${r.osm_type}:${r.osm_id}`:'',sourceTitle:S.share.title,sourceUrl:S.share.url,note:$('note').value.trim(),createdAt:new Date().toISOString()};let dupe=S.pins.some(x=>key(x)===key(p)&&norm(x.sourceUrl||x.sourceTitle)===norm(p.sourceUrl||p.sourceTitle));if(!dupe){S.pins.push(p);persist()}$('sheet').classList.remove('open');render();S.map.flyTo({center:[p.lon,p.lat],zoom:13,duration:800});toast(dupe?'这篇攻略已经存过了':'已保存到我的地图');$('share').value='';$('poi').value='';$('results').innerHTML='';$('note').value='';S.share=null;S.poi=null}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab==='mapScreen')setTimeout(()=>S.map.resize(),50)});$('add').onclick=openSheet;$('close').onclick=()=>$('sheet').classList.remove('open');$('next').onclick=()=>{S.share=extract($('share').value);if(!S.share.url){toast('还没识别到小红书链接');return}$('src').textContent='小红书 · '+S.share.title;step(2);setTimeout(()=>$('poi').focus(),80)};$('searchPoi').onclick=searchPoi;$('poi').onkeydown=e=>{if(e.key==='Enter')searchPoi()};$('back1').onclick=()=>step(1);$('back2').onclick=()=>step(2);$('save').onclick=save;$('fit').onclick=()=>fit();$('q').oninput=renderList;$('detailClose').onclick=()=>$('detail').classList.remove('open');$('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>S.map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:13,duration:800}),()=>toast('没有获得定位权限'));load();initMap();render()})();
</script>
</body></html>
