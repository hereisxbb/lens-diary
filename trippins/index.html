<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071613"><title>旅迹 TripPins</title><link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--ink:#18211e;--muted:#7d8581;--paper:#fffefa;--green:#25886a}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#071613;color:var(--ink)}button,input,textarea,select{font:inherit}.screen{position:absolute;inset:0;display:none;background:#f6f6f2;padding-bottom:74px}.screen.on{display:block}#mapScreen{padding:0;background:#071613}#map{position:absolute;inset:0 0 70px}.top{position:absolute;z-index:5;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.brand,.circle{pointer-events:auto;background:rgba(255,255,252,.94);backdrop-filter:blur(18px);box-shadow:0 8px 26px rgba(0,0,0,.13)}.brand{display:flex;align-items:center;gap:8px;padding:7px 11px 7px 8px;border-radius:18px}.logo{width:35px;height:35px;display:grid;place-items:center;border-radius:12px 12px 12px 4px;background:linear-gradient(145deg,#48bb98,#19795d);color:#fff;font-weight:900}.brand b{display:block;font-size:15px}.brand small{display:block;font-size:9px;color:var(--muted)}.circle{width:44px;height:44px;border:0;border-radius:50%;font-size:18px}.fab{position:absolute;z-index:5;right:15px;bottom:calc(205px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:#1b2522;color:#fff;padding:11px 15px;font-size:12px;font-weight:800;box-shadow:0 12px 32px rgba(0,0,0,.24)}.peek{position:absolute;z-index:4;left:10px;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));background:rgba(255,255,252,.96);backdrop-filter:blur(20px);border-radius:24px 24px 16px 16px;box-shadow:0 20px 55px rgba(0,0,0,.16);padding:10px 13px 13px;max-height:135px}.peekhead{display:flex;justify-content:space-between;align-items:center}.peekhead b{font-size:15px}.peekhead small{display:block;font-size:9px;color:var(--muted)}#nearby{display:flex;gap:8px;overflow:auto;margin-top:8px}.mini{min-width:145px;border:0;border-radius:13px;background:#f1f2ed;padding:9px;text-align:left}.mini b{display:block;font-size:11px}.mini small{font-size:9px;color:var(--muted)}.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(67px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,253,.97);border-top:1px solid #ecece7}.nav button{border:0;background:none;color:#959b98;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav span{font-size:20px}.nav button.on{color:#18211e}.head{padding:calc(24px + env(safe-area-inset-top)) 18px 13px;background:#fffefa}.head h1{margin:0;font-size:29px}.head p{margin:3px 0 0;font-size:10px;color:var(--muted)}.list{height:calc(100% - 106px - env(safe-area-inset-top));overflow:auto;padding:10px 12px}.card{background:#fff;border:1px solid #e9e8e2;border-radius:17px;padding:13px;margin:8px 0}.card b{font-size:14px}.meta{font-size:9px;color:var(--muted);margin-top:3px}.source{border-top:1px solid #eee;margin-top:9px;padding-top:9px;font-size:10px}.source button{border:0;background:#fff0ee;color:#c54841;border-radius:8px;padding:7px 9px;font-size:9px;font-weight:750}.settings{margin:12px 14px;background:#fff;border:1px solid #e8e7e1;border-radius:17px;padding:15px}.settings h3{font-size:14px;margin:0 0 7px}.settings p{font-size:11px;line-height:1.6;color:#68716d;margin:0}.sheetbg,.detailbg{position:fixed;inset:0;z-index:50;background:rgba(6,15,12,.38);display:none;align-items:flex-end;backdrop-filter:blur(4px)}.sheetbg.on,.detailbg.on{display:flex}.sheet,.detail{width:100%;max-height:88vh;overflow:auto;background:#fffefa;border-radius:26px 26px 0 0;padding:9px 18px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -25px 60px rgba(0,0,0,.2)}.grab{width:36px;height:4px;border-radius:5px;background:#d5d5cf;margin:0 auto 10px}.sheettitle{display:flex;justify-content:space-between;align-items:start}.sheettitle h2{font-size:24px;margin:0}.sheettitle p{font-size:10px;color:var(--muted);margin:2px 0 12px}.close{border:0;background:#eff0eb;width:32px;height:32px;border-radius:50%;font-size:17px}.step{display:none}.step.on{display:block}label{display:block;font-size:11px;font-weight:800;margin:11px 0 6px}textarea,input,select{width:100%;border:1px solid #e2e1dc;background:#faf9f6;border-radius:12px;padding:11px 12px;outline:none}textarea{resize:none;line-height:1.5}.primary{width:100%;border:0;border-radius:13px;background:#1a2421;color:#fff;padding:13px;font-weight:800;margin-top:13px}.ghost{width:100%;border:0;background:none;color:#747b78;padding:12px}.psearch{position:relative}.psearch input{padding-right:76px}.speed{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:9px;color:#2b7a63;background:#e5f5ee;padding:5px 7px;border-radius:999px}.hint{font-size:9px;color:#858c88;line-height:1.5;margin:7px 2px}.result{border:1px solid #e7e6e0;background:#fff;border-radius:14px;padding:10px;margin:7px 0;display:flex;gap:9px;align-items:start}.result>div{min-width:0;flex:1}.result b{font-size:12px}.result small{display:block;font-size:9px;color:var(--muted);margin-top:3px;line-height:1.4}.result button{border:0;background:var(--green);color:#fff;border-radius:8px;padding:7px 8px;font-size:9px;font-weight:800}.loading{padding:12px 2px;font-size:10px;color:#64706b}.loading:before{content:"";display:inline-block;width:12px;height:12px;border:2px solid #d9e7e1;border-top-color:#25886a;border-radius:50%;margin-right:7px;vertical-align:-2px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.selected{background:#eef8f4;border:1px solid #d4eee4;border-radius:14px;padding:11px}.selected b{display:block}.selected small{font-size:9px;color:#60756e}.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tripmarker{width:31px;height:36px;border:3px solid #fff;border-radius:15px 15px 15px 5px;background:#23876a;box-shadow:0 7px 18px rgba(0,0 </style></head><body><div id="app"><section id="mapScreen" class="screen on"><div id="map"></div><header class="top"><div class="brand"><span class="logo">⌖</span><div><b>旅迹</b><small>TripPins</small></div></div><button id="locate" class="circle">◎</button></header><button id="add" class="fab">＋ 从小红书收</button><section class="peek"><div class="peekhead"><div><b>我的旅行地图</b><small id="count">0 个地点</small></div><button id="fit" class="ghost" style="width:auto;padding:5px;color:#208567">查看全部</button></div><div id="nearby"></div></section></section><section id="savedScreen" class="screen"><div class="head"><h1>收藏</h1><p>按地点重新组织你存过的攻略</p></div><div id="list" class="list"></div></section><section id="meScreen" class="screen"><div class="head"><h1>旅迹</h1><p>Mobile MVP · v0.2</p></div><div class="settings"><h3>现在的主链路</h3><p>小红书分享 → 旅迹 → 快速搜索真实 POI → 一次确认 → 保存坐标与原帖 → 地图查看。</p></div><div class="settings"><h3>本次优化</h3><p>地点搜索改为快速搜索源优先、超时自动切换、输入自动搜索，并把结果缓存到本机。</p></div></section><nav class="nav"><button class="on" data-tab="mapScreen"><span>◉</span>地图</button><button data-tab="savedScreen"><span>☆</span>收藏</button><button data-tab="meScreen"><span>···</span>我的</button></nav></div>
<div id="sheet" class="sheetbg"><div class="sheet"><div class="grab"></div><div class="sheettitle"><div><h2>存到旅迹</h2><p>把一篇攻略变成地图上的真实地点</p></div><button id="close" class="close">×</button></div><div id="s1" class="step on"><label>小红书分享口令 / 链接</label><textarea id="share" rows="5" placeholder="把小红书「复制链接」得到的整段文字粘贴到这里"></textarea><button id="next" class="primary">下一步：找地点</button></div><div id="s2" class="step"><div id="src" class="hint"></div><label>这篇攻略主要存到哪里？</label><div class="psearch"><input id="poi" placeholder="例如：清水寺 京都" autocomplete="off"><span class="speed">快速搜索</span></div><div class="hint">输入后会自动搜索。只展示地图数据库中的真实地点，不读取评论 IP。</div><div id="results"></div><button id="back1" class="ghost">← 返回</button></div><div id="s3" class="step"><div id="selected" class="selected"></div><div class="cols"><div><label>收藏到</label><input id="collection" placeholder="京都 / 北海道"></div><div><label>分类</label><select id="cat"><option>景点</option><option>圣地巡礼</option><option>美食</option><option>咖啡</option><option>探店</option><option>伴手礼</option><option>购物</option><option>住宿</option><option>其他</option></select></div></div><label>备注（可选）</label><input id="note" placeholder="比如：凌晨五点去、人少、要预约…"><button id="save" class="primary">保存到我的地图</button><button id="back2" class="ghost">← 换一个地点</button></div></div></div>
<div id="detail" class="detailbg"><div class="detail"><div class="grab"></div><button id="detailClose" class="close" style="float:right">×</button><div id="detailBody"></div></div></div><div id="toast" class="toast"></div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script><script>
(()=>{const K='trippins_mobile_v1',C='trippins_poi_cache_v2',S={pins:[],map:null,markers:[],share:null,poi:null,abort:null,timer:0,lastNom:0},$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,'');function toast(m){let t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}function load(){try{S.pins=JSON.parse(localStorage.getItem(K)||'[]')}catch(_){S.pins=[]}}function persist(){localStorage.setItem(K,JSON.stringify(S.pins))}function key(p){return p.placeKey||`${norm(p.collection)}|${norm(p.poiName)}|${(+p.lat).toFixed(5)}|${(+p.lon).toFixed(5)}`}function groups(pins=S.pins){let m=new Map;for(const p of pins){let k=key(p);if(!m.has(k))m.set(k,{key:k,poiName:p.poiName,collection:p.collection,category:p.category,lat:+p.lat,lon:+p.lon,pins:[]});m.get(k).pins.push(p)}return[...m.values()]}function initMap(){S.map=new maplibregl.Map({container:'map',style:'https://demotiles.maplibre.org/globe.json',center:[120,28],zoom:1.25});S.map.on('style.load',()=>{try{S.map.setProjection({type:'globe'})}catch(_){}});S.map.on('load',()=>{render();fit(false)})}function render(){S.markers.forEach(m=>m.remove());S.markers=[];for(const g of groups()){let e=document.createElement('div');e.className='tripmarker';e.textContent=g.pins.length>1?g.pins.length:'';e.onclick=()=>openDetail(g.key);S.markers.push(new maplibregl.Marker({element:e,anchor:'bottom'}).setLngLat([g.lon,g.lat]).addTo(S.map))}let gs=groups();$('count').textContent=`${gs.length} 个地点 · ${S.pins.length} 篇攻略`;$('nearby').innerHTML=gs.length?gs.slice(0,7).map(g=>`<button class="mini" data-k="${esc(g.key)}"><b>${esc(g.poiName)}</b><small>${esc(g.collection)} · ${g.pins.length} 篇</small></button>`).join(''):'<div class="hint">还没有收藏，点「从小红书收」开始。</div>';$('nearby').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>openDetail(b.dataset.k));renderList()}function renderList(){let gs=groups();$('list').innerHTML=gs.length?gs.map(g=>`<article class="card"><b>${esc(g.poiName)}</b><div class="meta">${esc(g.collection)} · ${esc(g.category)} · ${g.pins.length} 篇</div>${g.pins.map(p=>`<div class="source"><b>${esc(p.sourceTitle)}</b>${p.sourceUrl?`<br><button data-u="${esc(p.sourceUrl)}">打开小红书原帖 ↗</button>`:''}</div>`).join('')}</article>`).join(''):'<div class="hint">还没有收藏。</div>';$('list').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>window.open(b.dataset.u,'_blank'))}function fit(anim=true){let gs=groups();if(!gs.length){S.map?.flyTo({center:[120,28],zoom:1.25,duration:anim?700:0});return}if(gs.length===1){S.map.flyTo({center:[gs[0].lon,gs[0].lat],zoom:12,duration:anim?700:0});return}let a=180,b=-180,c=90,d=-90;gs.forEach(g=>{a=Math.min(a,g.lon);b=Math.max(b,g.lon);c=Math.min(c,g.lat);d=Math.max(d,g.lat)});S.map.fitBounds([[a,c],[b,d]],{padding:{top:100,bottom:220,left:40,right:40},maxZoom:10,duration:anim?700:0})}function openDetail(k){let g=groups().find(x=>x.key===k);if(!g)return;$('detailBody').innerHTML=`<h2>${esc(g.poiName)}</h2><div class="meta">${esc(g.collection)} · ${esc(g.category)} · ${g.pins.length} 篇攻略</div>${g.pins.map(p=>`<div class="source"><b>${esc(p.sourceTitle)}</b>${p.note?`<p>${esc(p.note)}</p>`:''}${p.sourceUrl?`<br><button data-u="${esc(p.sourceUrl)}">打开小红书原帖 ↗</button>`:''}</div>`).join('')}`;$('detail').classList.add('on');$('detailBody').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>window.open(b.dataset.u,'_blank'))}function extract(raw){raw=String(raw||'').trim();let m=raw.match(/https?:\/\/(?:xhslink\.cn|www\.xiaohongshu\.com)\/[^\s\]\)]+/i)||raw.match(/https?:\/\/[^\s\]\)]+/i),url=m?.[0]?.replace(/[，。；;~～]+$/,'')||'',title=url?raw.slice(0,raw.indexOf(url)):raw;title=title.replace(/存下口令[\s\S]*$/,'').replace(/\s+/g,' ').trim();return{url,title:(title||'小红书旅行攻略').slice(0,80)}}function step(n){[1,2,3].forEach(i=>$('s'+i).classList.toggle('on',i===n))}function cache(){try{return JSON.parse(localStorage.getItem(C)||'{}')}catch(_){return{}}}function getCache(q){let h=cache()[norm(q)];return h&&Date.now()-h.at<604800000?h.rows:null}function putCache(q,rows){let c=cache();c[norm(q)]={at:Date.now(),rows};let ks=Object.keys(c).sort((x,y)=>c[y].at-c[x].at).slice(0,60),o={};ks.forEach(k=>o[k]=c[k]);localStorage.setItem(C,JSON.stringify(o))}async function timed(url,ms,signal){let c=new AbortController(),t=setTimeout(()=>c.abort(),ms),relay=()=>c.abort();signal?.addEventListener('abort',relay,{once:true});try{let r=await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(t);signal?.removeEventListener('abort',relay)}}function photon(data){return(data?.features||[]).slice(0,6).map(f=>{let p=f.properties||{},g=f.geometry?.coordinates||[],city=p.city||p.town||'',addr={city,town:p.town||'',county:p.county||'',state:p.state||'',country:p.country||''},parts=[p.name,p.street,city,p.state,p.country].filter(Boolean);return{name:p.name||p.street||'地点',display_name:[...new Set(parts)].join(', '),lat:+g[1],lon:+g[0],osm_type:p.osm_type||'',osm_id:p.osm_id||'',address:addr}}).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon))}async function geocode(q,signal){let hit=getCache(q);if(hit)return hit;try{let u='https://photon.komoot.io/api/?'+new URLSearchParams({q,limit:'6',lang:'zh'}),rows=photon(await timed(u,3000,signal));if(rows.length){putCache(q,rows);return rows}}catch(e){if(signal.aborted)throw e}let wait=Math.max(0,1050-(Date.now()-S.lastNom));if(wait)await new Promise(r=>setTimeout(r,wait));if(signal.aborted)throw new DOMException('Aborted','AbortError');S.lastNom=Date.now();let u='https://nominatim.openstreetmap.org/search?'+new URLSearchParams({q,format:'jsonv2',addressdetails:'1',limit:'5','accept-language':'zh-CN'}),rows=await timed(u,5000,signal);if(rows.length)putCache(q,rows);return rows}function short(r){return r.name||String(r.display_name||'地点').split(',')[0]}function collection(r){let a=r.address||{};return a.city||a.town||a.county||a.state||'旅行'}async function searchPoi(){let q=$('poi').value.trim();if(q.length<2)return;S.abort?.abort();S.abort=new AbortController();let sig=S.abort.signal,hit=getCache(q),start=performance.now();$('results').innerHTML=`<div class="loading">${hit?'正在读取本机缓存…':'正在快速搜索…'}</div>`;try{let rows=await geocode(q,sig);if(sig.aborted)return;if(!rows.length){$('results').innerHTML='<div class="hint">没找到。试试「地点名 + 城市/国家」，例如“清水寺 京都”。</div>';return}$('results').innerHTML=rows.map((r,i)=>`<div class="result"><div><b>${esc(short(r))}</b><small>${esc(r.display_name)}</small></div><button data-i="${i}">选这个</button></div>`).join('');$('results').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>choose(rows[+b.dataset.i]));if(performance.now()-start>1800)$('results').insertAdjacentHTML('beforeend','<div class="hint">首次搜索受网络影响；相同关键词下次会直接从本机缓存打开。</div>')}catch(e){if(e.name!=='AbortError')$('results').innerHTML='<div class="hint">地点服务这次响应太慢，请再试一次或补充城市/国家。</div>'}}function choose(r){S.poi=r;$('selected').innerHTML=`<b>📍 ${esc(short(r))}</b><small>${esc(r.display_name)}<br>${(+r.lat).toFixed(6)}, ${(+r.lon).toFixed(6)}</small>`;$('collection').value=collection(r);step(3)}function save(){if(!S.poi||!S.share)return;let r=S.poi,p={id:'p_'+Date.now(),poiName:short(r),collection:$('collection').value.trim()||'旅行',category:$('cat').value,lat:+r.lat,lon:+r.lon,placeKey:r.osm_type&&r.osm_id?`osm:${r.osm_type}:${r.osm_id}`:'',sourceTitle:S.share.title,sourceUrl:S.share.url,note:$('note').value.trim(),createdAt:new Date().toISOString()};let dupe=S.pins.some(x=>key(x)===key(p)&&norm(x.sourceUrl||x.sourceTitle)===norm(p.sourceUrl||p.sourceTitle));if(!dupe){S.pins.push(p);persist()}$('sheet').classList.remove('on');render();S.map.flyTo({center:[p.lon,p.lat],zoom:13,duration:800});toast(dupe?'这篇攻略已经存过了':'已保存到我的地图');$('share').value='';$('poi').value='';$('results').innerHTML='';$('note').value='';S.share=null;S.poi=null}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===b.dataset.tab));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));if(b.dataset.tab==='mapScreen')setTimeout(()=>S.map.resize(),50)});$('add').onclick=()=>{$('sheet').classList.add('on');step(1)};$('close').onclick=()=>$('sheet').classList.remove('on');$('next').onclick=()=>{S.share=extract($('share').value);if(!S.share.url){toast('还没识别到小红书链接');return}$('src').textContent='小红书 · '+S.share.title;step(2);setTimeout(()=>$('poi').focus(),80)};$('poi').oninput=()=>{clearTimeout(S.timer);if($('poi').value.trim().length>=2)S.timer=setTimeout(searchPoi,480)};$('poi').onkeydown=e=>{if(e.key==='Enter'){clearTimeout(S.timer);searchPoi()}};$('back1').onclick=()=>step(1);$('back2').onclick=()=>step(2);$('save').onclick=save;$('fit').onclick=()=>fit();$('detailClose').onclick=()=>$('detail').classList.remove('on');$('locate').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>S.map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:13,duration:800}),()=>toast('没有获得定位权限'));load();initMap();render()})();
</script></body></html>
