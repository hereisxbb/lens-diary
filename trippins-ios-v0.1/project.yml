name: TripPins
options:
  bundleIdPrefix: com.hereisxbb
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  TripPins:
    type: application
    platform: iOS
    sources:
      - TripPins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hereisxbb.TripPins
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 旅迹
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 旅迹使用你的位置来帮助你浏览附近地点。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
